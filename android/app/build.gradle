apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = true
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'
def releaseSigningProperties = [
    'DSH_RELEASE_STORE_FILE',
    'DSH_RELEASE_STORE_PASSWORD',
    'DSH_RELEASE_KEY_ALIAS',
    'DSH_RELEASE_KEY_PASSWORD',
]
def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}
def hasReleaseSigning = releaseSigningProperties.every {
    project.hasProperty(it) && project.property(it).toString().trim()
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace "dev.dshmobile"
    defaultConfig {
        applicationId "dev.dshmobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
        manifestPlaceholders = [usesCleartextTraffic: "true"]
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasReleaseSigning) {
                storeFile file(project.property('DSH_RELEASE_STORE_FILE'))
                storePassword project.property('DSH_RELEASE_STORE_PASSWORD')
                keyAlias project.property('DSH_RELEASE_KEY_ALIAS')
                keyPassword project.property('DSH_RELEASE_KEY_PASSWORD')
            } else if (releaseTaskRequested) {
                throw new GradleException(
                    'Release signing credentials are required. Refusing to build a release APK with the debug keystore.'
                )
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
