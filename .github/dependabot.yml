version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      react-native-toolchain:
        patterns:
          - react
          - react-native
          - '@react-native/*'
          - '@react-native-community/*'
      navigation:
        patterns:
          - '@react-navigation/*'
          - react-native-screens
          - react-native-safe-area-context

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - '*'
