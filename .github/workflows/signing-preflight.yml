name: Private Android signing preflight (no publication)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-signing:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout trusted repository branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
      - name: Install Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Install dependencies without access to release secrets
        run: |
          npm ci --no-audit --no-fund
          npm run native:bootstrap:android
      - name: Validate keystore, build signed APK and compare signing identity
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_DSH_RELEASE_STORE_FILE: ${{ runner.temp }}/dsh-release-preflight.p12
          ORG_GRADLE_PROJECT_DSH_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_DSH_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_DSH_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/dsh-release-preflight.p12"
          log="$RUNNER_TEMP/dsh-release-gradle.log"
          trap 'rm -f "$keystore" "$log"; rm -rf android/app/build/outputs/apk/release' EXIT
          for name in ANDROID_RELEASE_KEYSTORE_BASE64 ANDROID_RELEASE_STORE_PASSWORD ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing signing secret: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          keytool -list -storetype PKCS12 -keystore "$keystore" -storepass:env ANDROID_RELEASE_STORE_PASSWORD -alias "$ANDROID_RELEASE_KEY_ALIAS" >/dev/null
          echo 'Private keystore and alias validated.'
          chmod +x android/gradlew
          if ! ./android/gradlew -p android assembleRelease --no-daemon --console=plain --max-workers=2 > "$log" 2>&1; then
            echo 'Release build failed; raw logs remain private on this ephemeral runner.' >&2
            if grep -q 'Java heap space\|OutOfMemoryError\|Gradle build daemon disappeared' "$log"; then echo 'CATEGORY: memory/resource exhaustion'; fi
            if grep -q 'Could not resolve\|Read timed out\|Connection reset' "$log"; then echo 'CATEGORY: dependency/network resolution'; fi
            if grep -q 'bundleReleaseJsAndAssets\|createBundleReleaseJsAndAssets' "$log"; then echo 'CATEGORY: React Native bundle'; fi
            if grep -q 'validateSigningRelease\|packageRelease\|Keystore was tampered\|key password was incorrect' "$log"; then echo 'CATEGORY: signing or packaging'; fi
            if grep -q 'minifyReleaseWithR8\|R8:' "$log"; then echo 'CATEGORY: R8'; fi
            exit 1
          fi
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk" >/dev/null
          apk_cert=$("$apksigner" verify --print-certs "$apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print tolower($2); exit}')
          expected_cert=$(keytool -exportcert -rfc -storetype PKCS12 -keystore "$keystore" -storepass:env ANDROID_RELEASE_STORE_PASSWORD -alias "$ANDROID_RELEASE_KEY_ALIAS" | openssl x509 -noout -fingerprint -sha256 | awk -F= '{gsub(":", "", $2); print tolower($2)}')
          debug_cert=$(keytool -exportcert -rfc -keystore android/app/debug.keystore -storepass android -alias androiddebugkey | openssl x509 -noout -fingerprint -sha256 | awk -F= '{gsub(":", "", $2); print tolower($2)}')
          if [[ -z "$apk_cert" ]]; then echo 'APK signing certificate could not be read.' >&2; exit 1; fi
          if [[ -z "$expected_cert" ]]; then echo 'Configured private certificate could not be read.' >&2; exit 1; fi
          if [[ -z "$debug_cert" ]]; then echo 'Public debug certificate could not be read.' >&2; exit 1; fi
          if [[ "$apk_cert" != "$expected_cert" ]]; then echo 'APK signer does not match configured private key.' >&2; exit 1; fi
          if [[ "$apk_cert" == "$debug_cert" ]]; then echo 'APK uses the public debug key.' >&2; exit 1; fi
          echo 'PASS: signed APK matches the private certificate and differs from debug. No artifact or release published.'
