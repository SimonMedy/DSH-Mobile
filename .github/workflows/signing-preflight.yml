name: Private Android signing preflight (no publication)

on:
  workflow_dispatch:
  push:
    branches:
      - gpt/signing-preflight-20261117
    paths:
      - .github/workflows/signing-preflight.yml

permissions:
  contents: read

jobs:
  verify-signing:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout trusted repository branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
      - name: Install Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Validate private signing secrets without disclosing them
        shell: bash
        run: |
          set -euo pipefail
          for variable in ANDROID_RELEASE_KEYSTORE_BASE64 ANDROID_RELEASE_STORE_PASSWORD ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing signing secret: $variable" >&2
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/dsh-release-preflight.p12"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          keytool -list -storetype PKCS12 -keystore "$keystore" -storepass:env ANDROID_RELEASE_STORE_PASSWORD -alias "$ANDROID_RELEASE_KEY_ALIAS" >/dev/null
          echo 'Private signing key and alias can be opened.'
      - name: Install dependencies and verified Android Gradle wrapper
        run: |
          npm ci --no-audit --no-fund
          npm run native:bootstrap:android
      - name: Build a private release APK only for local signature verification
        shell: bash
        env:
          ORG_GRADLE_PROJECT_DSH_RELEASE_STORE_FILE: ${{ runner.temp }}/dsh-release-preflight.p12
          ORG_GRADLE_PROJECT_DSH_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_DSH_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_DSH_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          ./android/gradlew -p android assembleRelease --no-daemon
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk" >/dev/null
          release_cert=$("$apksigner" verify --print-certs "$apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print tolower($2); exit}')
          debug_cert=$(keytool -list -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | awk -F': ' '/SHA256:/ {gsub(":", "", $2); gsub(" ", "", $2); print tolower($2); exit}')
          if [[ -z "$release_cert" || -z "$debug_cert" || "$release_cert" == "$debug_cert" ]]; then
            echo 'Signing identity validation failed.' >&2
            exit 1
          fi
          echo 'Signed release APK built and verified with a non-debug certificate. No APK published.'
      - name: Erase temporary keystore and APK on runner
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/dsh-release-preflight.p12"
          rm -rf android/app/build/outputs/apk/release
