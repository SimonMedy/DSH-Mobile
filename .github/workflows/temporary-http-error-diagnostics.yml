name: Temporary browser HTTP diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
      - run: npm ci --no-audit --no-fund
      - name: Show exact formatting and run tests
        run: |
          npx prettier --write __tests__/browserHttpError.test.ts src/features/browser/screens/DshBrowserScreen.tsx
          git diff -- __tests__/browserHttpError.test.ts src/features/browser/screens/DshBrowserScreen.tsx
          npm run typecheck
          npm run lint
          npm test -- --runInBand
