name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build signed Android release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Install dependencies without signing credentials
        run: npm ci --no-audit --no-fund

      - name: Bootstrap verified Gradle wrapper
        run: npm run native:bootstrap:android

      - name: Configure release signing after dependency installation
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_RELEASE_KEYSTORE_BASE64 ANDROID_RELEASE_STORE_PASSWORD ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required release signing secret: $name" >&2
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/dsh-release.keystore"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          keytool -list -storetype PKCS12 -keystore "$keystore" -storepass:env ANDROID_RELEASE_STORE_PASSWORD -alias "$ANDROID_RELEASE_KEY_ALIAS" >/dev/null
          echo "ORG_GRADLE_PROJECT_DSH_RELEASE_STORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Build signed Android release APK
        env:
          ORG_GRADLE_PROJECT_DSH_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_DSH_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_DSH_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          ./android/gradlew -p android assembleRelease --no-daemon
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk dist/dsh-mobile.apk

      - name: Verify APK exactly matches the private release certificate
        shell: bash
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo 'apksigner not found' >&2
            exit 1
          fi
          "$apksigner" verify --verbose dist/dsh-mobile.apk >/dev/null
          pem_certs="$("$apksigner" verify --print-certs-pem dist/dsh-mobile.apk)"
          pem_count="$(printf '%s\n' "$pem_certs" | grep -c -- '-----BEGIN CERTIFICATE-----' || true)"
          if [[ "$pem_count" != '1' ]]; then
            echo 'Expected exactly one APK signing certificate.' >&2
            exit 1
          fi
          apk_cert="$(printf '%s\n' "$pem_certs" | openssl x509 -noout -fingerprint -sha256 | awk -F= '{gsub(":", "", $2); print tolower($2)}')"
          expected_cert="$(keytool -exportcert -rfc -storetype PKCS12 -keystore "$RUNNER_TEMP/dsh-release.keystore" -storepass:env ANDROID_RELEASE_STORE_PASSWORD -alias "$ANDROID_RELEASE_KEY_ALIAS" | openssl x509 -noout -fingerprint -sha256 | awk -F= '{gsub(":", "", $2); print tolower($2)}')"
          debug_cert="$(keytool -exportcert -rfc -keystore android/app/debug.keystore -storepass android -alias androiddebugkey | openssl x509 -noout -fingerprint -sha256 | awk -F= '{gsub(":", "", $2); print tolower($2)}')"
          if [[ -z "$apk_cert" || -z "$expected_cert" || -z "$debug_cert" ]]; then
            echo 'Could not read all signing certificates.' >&2
            exit 1
          fi
          if [[ "$apk_cert" != "$expected_cert" ]]; then
            echo 'Release APK does not match the configured private signing identity.' >&2
            exit 1
          fi
          if [[ "$apk_cert" == "$debug_cert" ]]; then
            echo 'Release APK uses the public debug signing identity.' >&2
            exit 1
          fi
          echo 'Release APK signature verified against the private key; debug identity rejected.'

      - name: Erase signing keystore from build runner
        if: always()
        run: rm -f "$RUNNER_TEMP/dsh-release.keystore"

      - name: Generate checksums
        run: |
          cd dist
          sha256sum dsh-mobile.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-mobile-release
          path: dist/*
          retention-days: 5

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dsh-mobile-release
          path: dist

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/dsh-mobile.apk dist/SHA256SUMS.txt --generate-notes --title "$TAG"
