name: Temporary pairing formatting diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
      - run: npm ci --no-audit --no-fund
      - name: Print Prettier-corrected source and typecheck
        run: |
          npx prettier --write docs/harness-auth-test-cases.md src/features/servers/screens/ServerSetupScreen.tsx
          echo '===FORMATTED_DOC_BASE64_BEGIN==='
          base64 -w0 docs/harness-auth-test-cases.md
          echo
          echo '===FORMATTED_DOC_BASE64_END==='
          echo '===FORMATTED_UI_BASE64_BEGIN==='
          base64 -w0 src/features/servers/screens/ServerSetupScreen.tsx
          echo
          echo '===FORMATTED_UI_BASE64_END==='
          npm run typecheck
          npm run lint
