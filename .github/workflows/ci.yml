name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
      - name: Verify declared dependency policy
        run: npm run deps:verify
      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Quality gate
        run: npm run check

  android:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Bootstrap verified Gradle wrapper
        run: npm run native:bootstrap:android
      - name: Build Android debug variant
        run: |
          chmod +x ./android/gradlew
          ./android/gradlew -p android assembleDebug --no-daemon

  ios:
    runs-on: macos-15
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Install CocoaPods dependencies
        run: bundle exec pod install --project-directory=ios
      - name: Build iOS simulator app
        run: >-
          xcodebuild
          -workspace ios/DshMobile.xcworkspace
          -scheme DshMobile
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
