name: Temporary release policy formatter diagnosis

on:
  pull_request:

permissions:
  contents: read

jobs:
  formatting:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
      - run: npm ci --no-audit --no-fund
      - name: Print exact formatting patch (no secrets)
        run: |
          npx prettier --write scripts/verify-release-policy.mjs
          git diff -- scripts/verify-release-policy.mjs
          node scripts/verify-release-policy.mjs
