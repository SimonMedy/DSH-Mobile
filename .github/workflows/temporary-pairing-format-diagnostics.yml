name: Temporary pairing formatting diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
      - run: npm ci --no-audit --no-fund
      - name: Show exact formatting patch and validate code
        run: |
          npx prettier --write __tests__/pairingFlow.test.ts src/features/servers/screens/ServerSetupScreen.tsx
          git diff -- __tests__/pairingFlow.test.ts src/features/servers/screens/ServerSetupScreen.tsx
          npm run typecheck
          npm run lint
          npm run test -- --runInBand
