services:
  # Lancer les vérifications de qualité (TypeScript, Linter, Tests Jest, Cohérence du projet)
  check:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - gradle_cache:/root/.gradle
    command: sh -c "npm ci && npm run check"

  # Compiler l'APK Android Debug et l'exporter dans le dossier local ./dist
  build-apk:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - gradle_cache:/root/.gradle
      - ./dist:/app/dist
    command: >
      sh -c "
        npm ci &&
        node scripts/bootstrap-gradle-wrapper.mjs &&
        cd android &&
        chmod +x gradlew &&
        ./gradlew assembleDebug &&
        mkdir -p /app/dist &&
        cp /app/android/app/build/outputs/apk/debug/app-debug.apk /app/dist/dsh-mobile-debug.apk &&
        echo '---------------------------------------------------------' &&
        echo '✅ APK Debug généré avec succès : ./dist/dsh-mobile-debug.apk' &&
        echo '---------------------------------------------------------'
      "

  # Compiler un APK Android Release signé. Les propriétés DSH_RELEASE_* sont obligatoires.
  build-release:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ORG_GRADLE_PROJECT_DSH_RELEASE_STORE_FILE
      - ORG_GRADLE_PROJECT_DSH_RELEASE_STORE_PASSWORD
      - ORG_GRADLE_PROJECT_DSH_RELEASE_KEY_ALIAS
      - ORG_GRADLE_PROJECT_DSH_RELEASE_KEY_PASSWORD
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - gradle_cache:/root/.gradle
      - ./dist:/app/dist
    command: >
      sh -c "
        npm ci &&
        node scripts/bootstrap-gradle-wrapper.mjs &&
        cd android &&
        chmod +x gradlew &&
        ./gradlew assembleRelease &&
        mkdir -p /app/dist &&
        cp /app/android/app/build/outputs/apk/release/*.apk /app/dist/dsh-mobile.apk &&
        echo '---------------------------------------------------------' &&
        echo '✅ APK Release signé généré : ./dist/dsh-mobile.apk' &&
        echo '---------------------------------------------------------'
      "

  # Serveur de développement Metro (pour connecter un appareil de test)
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - '8081:8081'
    command: sh -c "npm ci && npm start -- --host 0.0.0.0"

volumes:
  node_modules:
  gradle_cache:
